# ═══════════════ LankciAccount: налаштування ═══════════════
# Після зміни збережи файл і виконай у грі (OP) або в консолі: /lwaccount reload

# Адреса твого проєкту Supabase (Project URL)
supabase-url: "https://gnihbplmupknrcpbpzdp.supabase.co"

# ПУБЛІЧНИЙ ключ (publishable). Його не потрібно ховати.
supabase-key: "sb_publishable_pf9CORZo-qpF-bs__h3JHQ_0wLmxPGs"

# СЕКРЕТ ПЛАГІНА. Той самий рядок, чий хеш ти записав у Supabase командою
# select lw_private.set_plugin_secret('...');  Нікому не показуй і не публікуй.
plugin-secret: "ВСТАВ_СЮДИ_СЕКРЕТ_ПЛАГІНА"

# СЕКРЕТ ДЛЯ ХЕШУВАННЯ IP. Довгий випадковий рядок (мінімум 16 символів), придумай свій.
# Справжні IP гравців у базу не потрапляють, лише їхні хеші.
# Якщо змінити цей рядок, усі «знайомі IP» стануть невідомими й їх треба буде підтвердити знову.
ip-hash-secret: "ВСТАВ_СЮДИ_ДОВГИЙ_ВИПАДКОВИЙ_РЯДОК"

# Як часто опитувати сайт (секунди). Менше = швидша реакція, більше запитів.
poll-interval-seconds: 5

# Таймаут запитів до Supabase (мілісекунди)
http-timeout-ms: 3500

# Що робити, якщо Supabase недоступний під час входу:
#   true  = пускати гравців (захист на цей час не працює), рекомендовано
#   false = не пускати нікого з прив'язаним ніком (безпечніше, але при збої сайту гравці не зайдуть)
fail-open: true

# Сервіси визначення міста за IP. Пробуються по черзі, перший успішний виграє.
# Доступні назви: ipwhois, ipapi, freeipapi. Усі вони безкоштовні й мають свої ліміти.
geo-providers:
  - ipwhois
  - ipapi
  - freeipapi
geo-cache-hours: 24

# Повідомлення гравцям. Кольори: &6 помаранчевий, &f білий, &a зелений, &c червоний, &e жовтий.
