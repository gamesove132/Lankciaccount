  deny-new-ip: "&6Новий пристрій або IP.\n&fПідтверди вхід на сайті (вкладка «Акаунт»), потім заходь знову."
  deny-locked: "&cЦей акаунт заблокував його власник.\n&fРозблокувати можна на сайті (вкладка «Акаунт»)."
